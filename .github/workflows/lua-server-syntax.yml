name: Server Lua syntax
'on':
  push:
    branches:
    - main
    - ci/**
    paths: &id001
    - server/**/*.lua
    - server/ci/CheckLuaSyntax.py
    - .github/workflows/lua-server-syntax.yml
  pull_request:
    paths: *id001
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install LuaJIT
      run: |
        sudo apt-get update
        sudo apt-get install -y luajit
    - name: Compile Lua files without execution
      run: |
        mkdir -p build/diagnostics
        set -o pipefail
        python3 ci/CheckLuaSyntax.py 2>&1 | tee build/diagnostics/lua-syntax.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: server-lua-syntax-diagnostics
        path: server/build/diagnostics/lua-syntax.log
        retention-days: 14
    defaults:
      run:
        working-directory: server
